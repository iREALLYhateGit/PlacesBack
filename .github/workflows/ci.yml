name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'labs/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types:
      - orchestrated-integration-ci

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.event.client_payload.ref_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: test (JUnit + Mockito)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.event.client_payload.ref_name || github.ref_name }}

      - name: set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: gradle

      - name: give execute permissions
        run: chmod +x ./gradlew

      - name: run tests
        run: ./gradlew test

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: gradle

      - run: chmod +x ./gradlew

      - name: Build (skip tests)
        run: ./gradlew assemble  
  
  docker:
    name: docker
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.event.client_payload.ref_name || github.ref_name }}

      - name: log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: shuasd/places-backend
