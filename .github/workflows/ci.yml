name: CI

on:
  push:
    branches:
      - main
      - dev
      - 'labs/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types:
      - orchestrated-integration-ci

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.event.client_payload.ref_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test (JUnit + Mockito)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.event.client_payload.ref_name || github.ref_name }}

      - name: set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: graalvm
          java-version: "25"
          cache: gradle

      - name: give execute permissions
        run: chmod +x ./gradlew

      - name: build-test
        run: ./gradlew build
